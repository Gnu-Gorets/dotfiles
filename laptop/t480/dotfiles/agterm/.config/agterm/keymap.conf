# agterm keymap — a kitty-flavored config for rebinding built-in shortcuts and defining
# custom shell commands. Edit this file and run File ▸ Reload Keymap (or `agtermctl keymap
# reload`) to apply. Blank lines and lines starting with `#` are ignored.
#
# Two verbs:
#
#   map <chord> <action>
#       Rebind a built-in action to a single chord (no leader sequences for built-ins).
#       Chords use kitty syntax: mods joined by `+`, e.g. `cmd+shift+d`, `ctrl+\``.
#       Mods: ctrl, cmd, opt, shift. A Shift-typed symbol is shift+<base key>
#       (shift+/ for ?, shift+= for +, shift+5 for %). Example:
#
#           map cmd+shift+d  toggle_split
#
#   command "<name>" [chord] <shell...>
#       Define a custom command, shown in the action palette marked `custom`. The quoted
#       name may contain spaces. An optional chord (single chord OR a leader like `ctrl+a>g`)
#       binds it to a key; the chord MUST include a modifier (a bare key is rejected and the
#       line becomes palette-only). Omit the chord for a palette-only command. The rest of the
#       line is run via `/bin/sh -c`, detached with no terminal — so it suits fire-and-forget
#       launches (GUI apps, scripts), NOT a bare interactive or full-screen TUI program, which
#       has no TTY and exits at once. Launch a TUI over a session through an overlay terminal,
#       as the Lazygit example does. Examples:
#
#           command "Open in Zed"  cmd+shift+e  open -a Zed "$AGT_SESSION_PWD"
#           command "Lazygit"      ctrl+a>g     agtermctl session overlay open lazygit --socket "$AGT_SOCKET"
#           command "Deploy"                    ./deploy.sh
#
# Built-in actions (raw name → shipped default chord):
#
#   new_window                  cmd+opt+n
#   rename_window               (no default)
#   delete_window               (no default)
#   new_workspace               cmd+shift+n
#   rename_workspace            (no default)
#   delete_workspace            (no default)
#   new_session                 cmd+n
#   open_directory              cmd+o
#   rename_session              (no default)
#   duplicate_session           (no default)
#   close_session               cmd+w
#   reopen_recent               cmd+shift+t
#   undo_close                  cmd+z
#   clear_status                (no default)
#   increase_font_size          (not expressible)
#   decrease_font_size          cmd+-
#   reset_font_size             cmd+0
#   toggle_split                cmd+d
#   toggle_scratch              cmd+j
#   toggle_terminal_zoom        cmd+shift+return
#   toggle_search               cmd+f
#   toggle_sidebar              ctrl+cmd+s
#   select_theme                (no default)
#   toggle_fullscreen           ctrl+cmd+f
#   toggle_flagged_view         (no default)
#   toggle_flag                 cmd+shift+f
#   focus_workspace             (no default)
#   toggle_workspace_filter     (no default)
#   focus_left_pane             cmd+opt+left
#   focus_right_pane            cmd+opt+right
#   previous_session            cmd+opt+up
#   next_session                cmd+opt+down
#   previous_attention_session  ctrl+opt+up
#   next_attention_session      ctrl+opt+down
#   first_session               (no default)
#   last_session                (no default)
#   quick_terminal              ctrl+`
#   session_palette             ctrl+p
#   command_palette             ctrl+shift+p
#   custom_command_palette      ctrl+shift+o
#   show_attention              ctrl+shift+i
#   dashboard                   cmd+shift+d
#
# Custom-command tokens (expanded in the shell line and exported as $AGT_X env vars):
#
#   {AGT_SESSION_ID}
#   {AGT_SESSION_NAME}
#   {AGT_SESSION_PWD}
#   {AGT_WORKSPACE_ID}
#   {AGT_WORKSPACE_NAME}
#   {AGT_WINDOW_ID}
#   {AGT_WINDOW_NAME}
#   {AGT_PANE}
#   {AGT_SELECTION}
#   {AGT_SOCKET}
#
# NOTE: a {AGT_X} token is substituted RAW into the /bin/sh line — convenient, but unsafe for
# content you don't control. {AGT_SELECTION} is the obvious case, but a remote host can also set
# the session title (OSC) and the working directory (OSC 7), so {AGT_SESSION_NAME} and
# {AGT_SESSION_PWD} are equally unsafe raw. For any such content prefer the matching $AGT_X
# environment variable, QUOTED, e.g. "$AGT_SELECTION".
#
# Local Linux bindings. `cmd` is kitty syntax for physical Super.
map cmd+d toggle_split
map cmd+shift+j toggle_scratch
map cmd+shift+d dashboard

# Super+n opens a Pi split; Super+Shift+g opens a plain terminal session.
map ctrl+shift+t new_session
command "New Session (split)" cmd+n sh -c 'exec "$HOME/.config/agterm/new-session-split.sh" current'
command "New Terminal" cmd+shift+g agtermctl session new --name terminal
command "New Workspace (terminal split)" cmd+shift+w sh -c 'exec "$HOME/.config/agterm/new-session-split.sh" workspace'
command "Yazi overlay" cmd+shift+y sh -c 'ctl="$(dirname "$(dirname "$AGTERM_GHOSTTY_RESOURCES")")/bin/agtermctl"; "$ctl" session overlay open "zsh -lc yazi" --size-percent 95 --follow --socket "$AGT_SOCKET"'
command "Revdiff overlay" cmd+shift+r sh -c 'ctl="$(dirname "$(dirname "$AGTERM_GHOSTTY_RESOURCES")")/bin/agtermctl"; "$ctl" session overlay open "zsh -lc revdiff --untracked" --size-percent 95 --follow --socket "$AGT_SOCKET"'
command "Hotkeys" cmd+shift+h sh -c 'exec "$HOME/.config/agterm/hotkeys-overlay.sh"'
